name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub Release
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg --ci
      - name: Pack macOS update archive
        run: |
          macos_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          app_path=$(find "$macos_dir" -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$app_path" ]; then
            echo "macOS .app bundle not found" >&2
            exit 1
          fi
          app_name=$(basename "$app_path")
          COPYFILE_DISABLE=1 tar -czf "$macos_dir/account-manager-macos-arm64.app.tar.gz" -C "$macos_dir" "$app_name"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/account-manager-macos-arm64.app.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [macos]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: macos-arm64-dmg
          path: ${{ runner.temp }}/artifacts/macos
      - name: Prepare release assets and latest.json
        run: |
          pub_dir="$RUNNER_TEMP/publish"
          mkdir -p "$pub_dir"

          mac_tar=$(find "$RUNNER_TEMP/artifacts/macos" -name '*.app.tar.gz' -type f | head -n 1)
          mac_dmg=$(find "$RUNNER_TEMP/artifacts/macos" -name '*.dmg' -type f | head -n 1)
          if [ -z "$mac_tar" ] || [ -z "$mac_dmg" ]; then
            echo "Missing required build artifact(s)" >&2
            exit 1
          fi

          cp "$mac_tar" "$pub_dir/account-manager-macos-arm64.app.tar.gz"
          cp "$mac_dmg" "$pub_dir/account-manager-macos-arm64.dmg"

          cfg_version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version=$(printf '%s' "$tag" | sed 's/^[vV]//')
          else
            version="$cfg_version"
            tag="v${version}"
          fi

          mac_sha=$(sha256sum "$pub_dir/account-manager-macos-arm64.app.tar.gz" | awk '{print $1}')
          mac_size=$(stat -c%s "$pub_dir/account-manager-macos-arm64.app.tar.gz")

          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          prev_tag=$(git tag --sort=-creatordate | grep -vxF "$tag" | head -n 1 || true)
          if [ -n "$prev_tag" ]; then
            notes=$(git log "${prev_tag}..HEAD" --pretty=format:"- %s" 2>/dev/null || true)
          fi
          if [ -z "${notes:-}" ]; then
            notes=$(git log -n 10 --pretty=format:"- %s" 2>/dev/null || echo "Release ${tag}")
          fi

          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg release_page_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            --arg mac_url "${base_url}/account-manager-macos-arm64.app.tar.gz" \
            --arg mac_sha "$mac_sha" \
            --argjson mac_size "$mac_size" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              release_page_url: $release_page_url,
              platforms: {
                macos: {
                  url: $mac_url,
                  sha256: $mac_sha,
                  filename: "account-manager-macos-arm64.app.tar.gz",
                  size: $mac_size
                }
              }
            }' > "$pub_dir/latest.json"

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          printf '%s\n' "$notes" > "$pub_dir/release-notes.txt"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pub_dir="$RUNNER_TEMP/publish"
          files=(
            "$pub_dir/account-manager-macos-arm64.app.tar.gz"
            "$pub_dir/account-manager-macos-arm64.dmg"
            "$pub_dir/latest.json"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "叠号 $RELEASE_TAG" --notes-file "$pub_dir/release-notes.txt"
          else
            extra_args=()
            if [ "${{ github.ref_type }}" != "tag" ]; then
              extra_args+=(--target "$GITHUB_SHA")
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" \
              "${extra_args[@]}" \
              --title "叠号 $RELEASE_TAG" \
              --notes-file "$pub_dir/release-notes.txt"
          fi
